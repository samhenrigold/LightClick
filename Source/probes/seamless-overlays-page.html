<!-- For seamless-compare's overlays: moves at the top left. A click opens a window whose popup menu the next click opens. -->
<title>Seamless page</title><style>@-webkit-keyframes m{to{-webkit-transform:translate3d(200px,0,0)}}
div{width:80px;height:80px;background:#28c;-webkit-animation:m 2s infinite alternate}</style>
<h1>Underneath</h1><div></div><p>Some text in the first window.</p>
<script>document.onmousedown=function(){var w=window.open('','_blank','width=420,height=320,left='+(screenX+outerWidth-300)+',top='+(screenY+outerHeight-260));
w.document.write('<title>In front</title><select onchange="0" onblur="0" style="position:absolute;left:0;top:0;width:100%;height:100%;font-size:18px"><option>One<option>Two<option>Three</select>');
var c=0;w.document.onmouseup=function(){if(++c==2)w.setTimeout(function(){w.alert('A sheet')},2000)};document.onmousedown=null}</script>
